backend:
  name: git-gateway
  branch: main

media_folder: "assets/images/uploads"
public_folder: "assets/images/uploads"

site_url: https://www.anacletsexpert.com/
display_url: https://www.anacletsexpert.com/

collections:
  - name: "site"
    label: "Website Content"
    files:
      - name: "brand"
        label: "Brand & Contact Info"
        file: "content/brand.json"
        fields:
          - { label: "Brand", name: "brand", widget: "object", fields: [
              { label: "Short Name (e.g. AELFC)", name: "name", widget: "string" },
              { label: "Suffix (e.g. Ltd)", name: "suffix", widget: "string" },
              { label: "Tagline (small text under logo)", name: "tagline", widget: "string" },
              { label: "Full Company Name", name: "companyFullName", widget: "string" },
              { label: "Footer Tagline", name: "footerTagline", widget: "string" },
              { label: "Copyright Name", name: "copyrightName", widget: "string" }
            ]}
          - { label: "Contact Info", name: "contactInfo", widget: "object", fields: [
              { label: "Email", name: "email", widget: "string" },
              { label: "Phone (display, e.g. +250 788 236 356)", name: "phoneDisplay", widget: "string" },
              { label: "Phone (digits only, e.g. 250788236356)", name: "phoneDigits", widget: "string" },
              { label: "Website", name: "website", widget: "string" },
              { label: "Business Hours (leave empty to hide)", name: "businessHours", widget: "string", required: false }
            ]}
          - { label: "Social Media Links (leave any empty to hide that icon)", name: "socialLinks", widget: "object", fields: [
              { label: "Facebook URL", name: "facebook", widget: "string", required: false },
              { label: "Instagram URL", name: "instagram", widget: "string", required: false },
              { label: "LinkedIn URL", name: "linkedin", widget: "string", required: false },
              { label: "X / Twitter URL", name: "twitter", widget: "string", required: false },
              { label: "YouTube URL", name: "youtube", widget: "string", required: false }
            ]}

      - name: "hero"
        label: "Hero Section"
        file: "content/hero.json"
        fields:
          - { label: "Hero", name: "hero", widget: "object", fields: [
              { label: "Eyebrow (small text above headline)", name: "eyebrow", widget: "string" },
              { label: "Headline Start", name: "headlineStart", widget: "string" },
              { label: "Headline Highlight (colored words)", name: "headlineHighlight", widget: "string" },
              { label: "Headline End", name: "headlineEnd", widget: "string" },
              { label: "Lede Paragraph", name: "lede", widget: "text" },
              { label: "Primary Button Label", name: "primaryCtaLabel", widget: "string" },
              { label: "Secondary Button Label", name: "secondaryCtaLabel", widget: "string" },
              { label: "Hero Photos (rotates automatically if more than one)", name: "images", widget: "list", fields: [
                  { label: "Photo", name: "src", widget: "image" },
                  { label: "Alt Text", name: "alt", widget: "string" }
                ]},
              { label: "Stats", name: "stats", widget: "list", fields: [
                  { label: "Value", name: "value", widget: "string" },
                  { label: "Label", name: "label", widget: "string" }
                ]}
            ]}

      - name: "about"
        label: "About Us Section"
        file: "content/about.json"
        fields:
          - { label: "About", name: "about", widget: "object", fields: [
              { label: "Tag", name: "tag", widget: "string" },
              { label: "Heading", name: "heading", widget: "string" },
              { label: "Lede", name: "lede", widget: "text" },
              { label: "Paragraphs", name: "paragraphs", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } },
              { label: "Vision", name: "vision", widget: "text" },
              { label: "Mission", name: "mission", widget: "text" },
              { label: "Core Values", name: "coreValues", widget: "list", field: { label: "Value", name: "value", widget: "string" } },
              { label: "Motto Quote", name: "mottoQuote", widget: "string" },
              { label: "Motto Subtext", name: "mottoSub", widget: "string" }
            ]}
          - { label: "Our Approach / Why Choose Us", name: "approach", widget: "object", fields: [
              { label: "Tag", name: "tag", widget: "string" },
              { label: "Heading", name: "heading", widget: "string" },
              { label: "Approach Points", name: "items", widget: "list", fields: [
                  { label: "Title", name: "title", widget: "string" },
                  { label: "Text", name: "text", widget: "text" }
                ]}
            ]}
          - { label: "Management Team", name: "team", widget: "object", fields: [
              { label: "Tag", name: "tag", widget: "string" },
              { label: "Heading", name: "heading", widget: "string" },
              { label: "Team Members (this section stays hidden on the live site until you add at least one)", name: "items", widget: "list", required: false, fields: [
                  { label: "Name", name: "name", widget: "string" },
                  { label: "Position", name: "role", widget: "string" },
                  { label: "Photo", name: "photo", widget: "image", required: false },
                  { label: "Experience / Bio", name: "bio", widget: "text" }
                ]}
            ]}

      - name: "founder"
        label: "Meet the Founder Section"
        file: "content/founder.json"
        fields:
          - { label: "Founder", name: "founder", widget: "object", fields: [
              { label: "Tag", name: "tag", widget: "string" },
              { label: "Name", name: "name", widget: "string" },
              { label: "Role", name: "role", widget: "string" },
              { label: "Photo", name: "image", widget: "image" },
              { label: "Photo Alt Text", name: "imageAlt", widget: "string" },
              { label: "Bio Paragraphs", name: "paragraphs", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } },
              { label: "Areas of Expertise", name: "expertise", widget: "list", field: { label: "Item", name: "item", widget: "string" } },
              { label: "Philosophy Quote", name: "quote", widget: "text" },
              { label: "Button Label", name: "ctaLabel", widget: "string" }
            ]}

      - name: "services"
        label: "Services Section"
        file: "content/services.json"
        fields:
          - { label: "Services", name: "services", widget: "object", fields: [
              { label: "Tag", name: "tag", widget: "string" },
              { label: "Heading", name: "heading", widget: "string" },
              { label: "Service Cards", name: "items", widget: "list", fields: [
                  { label: "Title", name: "title", widget: "string" },
                  { label: "Bullet Points (leave empty to use description instead)", name: "bullets", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" }, required: false },
                  { label: "Short Description (used when there are no bullet points)", name: "description", widget: "text", required: false },
                  { label: "Request text (what gets sent on WhatsApp)", name: "requestText", widget: "string" }
                ]}
            ]}

      - name: "mediation"
        label: "Mediation Section"
        file: "content/mediation.json"
        fields:
          - { label: "Mediation", name: "mediation", widget: "object", fields: [
              { label: "Tag", name: "tag", widget: "string" },
              { label: "Heading", name: "heading", widget: "string" },
              { label: "Lede", name: "lede", widget: "text" },
              { label: "Practice Areas", name: "items", widget: "list", field: { label: "Area", name: "area", widget: "string" } }
            ]}

      - name: "tools"
        label: "Tools Section"
        file: "content/tools.json"
        fields:
          - { label: "Tools", name: "tools", widget: "object", fields: [
              { label: "Tag", name: "tag", widget: "string" },
              { label: "Heading", name: "heading", widget: "string" },
              { label: "Lede", name: "lede", widget: "text" },
              { label: "'Coming Soon' Label", name: "comingSoonLabel", widget: "string" },
              { label: "'Coming Soon' Items", name: "comingSoon", widget: "list", field: { label: "Item", name: "item", widget: "string" } }
            ]}

      - name: "brochures"
        label: "Brochures Section"
        file: "content/brochures.json"
        fields:
          - { label: "Brochures", name: "brochures", widget: "object", fields: [
              { label: "Tag", name: "tag", widget: "string" },
              { label: "Heading", name: "heading", widget: "string" },
              { label: "Lede", name: "lede", widget: "text" },
              { label: "Brochure Images", name: "items", widget: "list", fields: [
                  { label: "Image", name: "image", widget: "image" },
                  { label: "Alt Text", name: "alt", widget: "string" }
                ]}
            ]}

      - name: "certifications"
        label: "Certifications & Registrations"
        file: "content/certifications.json"
        fields:
          - { label: "Certifications", name: "certifications", widget: "object", fields: [
              { label: "Tag", name: "tag", widget: "string" },
              { label: "Heading", name: "heading", widget: "string" },
              { label: "Lede", name: "lede", widget: "text" },
              { label: "Certificates (this section stays hidden on the live site until you add at least one)", name: "items", widget: "list", required: false, fields: [
                  { label: "Title (e.g. Data Controller Certificate)", name: "title", widget: "string" },
                  { label: "Certificate File (PDF or image)", name: "file", widget: "file" },
                  { label: "Thumbnail Image (optional)", name: "image", widget: "image", required: false },
                  { label: "Description (optional)", name: "description", widget: "text", required: false }
                ]}
            ]}

      - name: "fees"
        label: "Fees & Booking Section"
        file: "content/fees.json"
        fields:
          - { label: "Fees", name: "fees", widget: "object", fields: [
              { label: "Tag", name: "tag", widget: "string" },
              { label: "Heading", name: "heading", widget: "string" },
              { label: "Lede", name: "lede", widget: "text" },
              { label: "Pricing Cards", name: "items", widget: "list", fields: [
                  { label: "Title", name: "title", widget: "string" },
                  { label: "Price", name: "price", widget: "string" },
                  { label: "Highlight this card?", name: "featured", widget: "boolean", default: false },
                  { label: "Badge text (only if highlighted)", name: "badge", widget: "string", required: false },
                  { label: "WhatsApp message text", name: "whatsappText", widget: "string" }
                ]}
              ,
              { label: "Booking Form Tag", name: "formTag", widget: "string" },
              { label: "Booking Form Heading", name: "formHeading", widget: "string" },
              { label: "Booking Form Lede", name: "formLede", widget: "text" }
            ]}

      - name: "resources"
        label: "Resources Section (Newsletter, Blog & Videos)"
        file: "content/resources.json"
        fields:
          - { label: "Resources", name: "resources", widget: "object", fields: [
              { label: "Tag", name: "tag", widget: "string" },
              { label: "Heading", name: "heading", widget: "string" },
              { label: "Lede", name: "lede", widget: "text" },
              { label: "Newsletter", name: "newsletter", widget: "object", fields: [
                  { label: "Heading", name: "heading", widget: "string" },
                  { label: "Text", name: "text", widget: "text" },
                  { label: "Button Label", name: "buttonLabel", widget: "string" }
                ]},
              { label: "Blog", name: "blog", widget: "object", fields: [
                  { label: "Tag", name: "tag", widget: "string" },
                  { label: "Heading", name: "heading", widget: "string" },
                  { label: "Posts (this section stays hidden on the live site until you add at least one)", name: "items", widget: "list", required: false, fields: [
                      { label: "Title", name: "title", widget: "string" },
                      { label: "Published?", name: "published", widget: "boolean", default: true },
                      { label: "Publish Date (post stays hidden until this date — leave empty to show immediately)", name: "publishDate", widget: "datetime", required: false },
                      { label: "Feature this post?", name: "featured", widget: "boolean", default: false },
                      { label: "Category (e.g. Legal, Tax, Finance, Company News)", name: "category", widget: "string", required: false },
                      { label: "Tags", name: "tags", widget: "list", field: { label: "Tag", name: "tag", widget: "string" }, required: false },
                      { label: "Date (display text, e.g. August 2026)", name: "date", widget: "string", required: false },
                      { label: "Image (optional)", name: "image", widget: "image", required: false },
                      { label: "Excerpt", name: "excerpt", widget: "text" },
                      { label: "Link (where the full post lives — your own page, LinkedIn, Medium, etc.)", name: "link", widget: "string" }
                    ]}
                ]},
              { label: "Videos", name: "videos", widget: "object", fields: [
                  { label: "Tag", name: "tag", widget: "string" },
                  { label: "Heading", name: "heading", widget: "string" },
                  { label: "Videos (this section stays hidden on the live site until you add at least one)", name: "items", widget: "list", required: false, fields: [
                      { label: "Title", name: "title", widget: "string" },
                      { label: "YouTube/Vimeo Embed URL (e.g. https://www.youtube.com/embed/VIDEO_ID)", name: "embedUrl", widget: "string" }
                    ]}
                ]}
            ]}

      - name: "testimonials"
        label: "Trusted By / Client Testimonials"
        file: "content/testimonials.json"
        fields:
          - { label: "Testimonials", name: "testimonials", widget: "object", fields: [
              { label: "Tag", name: "tag", widget: "string" },
              { label: "Heading", name: "heading", widget: "string" },
              { label: "Lede", name: "lede", widget: "text", required: false },
              { label: "Submission Prompt Heading", name: "submitHeading", widget: "string" },
              { label: "Submission Prompt Text", name: "submitText", widget: "text" },
              { label: "Testimonials (this section stays hidden on the live site until you add at least one — review every submission before adding it here)", name: "items", widget: "list", required: false, fields: [
                  { label: "Client / Company Name", name: "clientName", widget: "string" },
                  { label: "Company Logo (optional)", name: "logo", widget: "image", required: false },
                  { label: "Testimonial (leave empty for a logo-only client entry, with no quote)", name: "testimonial", widget: "text", required: false },
                  { label: "Service Provided", name: "serviceProvided", widget: "string", required: false },
                  { label: "Period / Year Worked Together", name: "period", widget: "string", required: false },
                  { label: "Client Category / Industry", name: "category", widget: "string", required: false },
                  { label: "Website / Social Link (optional)", name: "link", widget: "string", required: false },
                  { label: "Full Success Story (optional — a longer write-up; shown behind a \"Read full story\" link)", name: "fullStory", widget: "text", required: false }
                ]}
            ]}

      - name: "events"
        label: "Events"
        file: "content/events.json"
        fields:
          - { label: "Events", name: "events", widget: "object", fields: [
              { label: "Tag", name: "tag", widget: "string" },
              { label: "Heading", name: "heading", widget: "string" },
              { label: "Lede", name: "lede", widget: "text" },
              { label: "Events — set a date; it moves to Past Events automatically once that date is gone (this section stays hidden until you add at least one)", name: "items", widget: "list", required: false, fields: [
                  { label: "Title", name: "title", widget: "string" },
                  { label: "Description", name: "description", widget: "text" },
                  { label: "Date", name: "date", widget: "date" },
                  { label: "Time (optional)", name: "time", widget: "string", required: false },
                  { label: "Venue", name: "venue", widget: "string", required: false },
                  { label: "Image (optional)", name: "image", widget: "image", required: false },
                  { label: "Registration / Booking Link (optional — for upcoming events)", name: "registrationLink", widget: "string", required: false },
                  { label: "Recap / Report (optional — for past events)", name: "recap", widget: "text", required: false }
                ]}
            ]}

      - name: "announcements"
        label: "Announcements"
        file: "content/announcements.json"
        fields:
          - { label: "Announcements", name: "announcements", widget: "object", fields: [
              { label: "Tag", name: "tag", widget: "string" },
              { label: "Heading", name: "heading", widget: "string" },
              { label: "Announcements (this section stays hidden until you add at least one)", name: "items", widget: "list", required: false, fields: [
                  { label: "Title", name: "title", widget: "string" },
                  { label: "Category", name: "category", widget: "select", options: ["Company News", "Important Notices", "Training", "Events", "Career Opportunities", "Promotions"] },
                  { label: "Short Description (shown in the list/banner)", name: "shortDescription", widget: "text" },
                  { label: "Full Description (optional)", name: "fullDescription", widget: "text", required: false },
                  { label: "Image (optional)", name: "image", widget: "image", required: false },
                  { label: "Attachment (optional)", name: "attachment", widget: "file", required: false },
                  { label: "Publish Date (hidden before this date)", name: "publishDate", widget: "date" },
                  { label: "Expiry Date (moves to Past Announcements after this date)", name: "expiryDate", widget: "date", required: false },
                  { label: "Priority", name: "priority", widget: "select", options: ["Normal", "Urgent"], default: "Normal" },
                  { label: "Status", name: "status", widget: "select", options: ["Draft", "Published"], default: "Draft" },
                  { label: "Author (optional)", name: "author", widget: "string", required: false },
                  { label: "Button Label (optional)", name: "ctaLabel", widget: "string", required: false },
                  { label: "Button Link (optional)", name: "ctaLink", widget: "string", required: false }
                ]}
            ]}

      - name: "faq"
        label: "FAQs"
        file: "content/faq.json"
        fields:
          - { label: "FAQ", name: "faq", widget: "object", fields: [
              { label: "Tag", name: "tag", widget: "string" },
              { label: "Heading", name: "heading", widget: "string" },
              { label: "Questions (this section stays hidden on the live site until you add at least one)", name: "items", widget: "list", required: false, fields: [
                  { label: "Question", name: "question", widget: "string" },
                  { label: "Answer", name: "answer", widget: "text" }
                ]}
            ]}

      - name: "donate"
        label: "Donate Section"
        file: "content/donate.json"
        fields:
          - { label: "Donate", name: "donate", widget: "object", fields: [
              { label: "Tag", name: "tag", widget: "string" },
              { label: "Heading", name: "heading", widget: "string" },
              { label: "Description Text", name: "text", widget: "text" },
              { label: "Button Label", name: "buttonLabel", widget: "string" },
              { label: "Button Link (payment page, MoMo instructions, etc. — this section stays hidden on the live site until this is filled in)", name: "buttonLink", widget: "string", required: false }
            ]}

      - name: "community"
        label: "Support Our Work Section"
        file: "content/community.json"
        fields:
          - { label: "Community", name: "community", widget: "object", fields: [
              { label: "Tag", name: "tag", widget: "string" },
              { label: "Heading", name: "heading", widget: "string" },
              { label: "Text", name: "text", widget: "text" },
              { label: "Button Label", name: "ctaLabel", widget: "string" },
              { label: "WhatsApp message text", name: "ctaWhatsappText", widget: "string" }
            ]}

      - name: "contact"
        label: "Contact Section"
        file: "content/contact.json"
        fields:
          - { label: "Contact", name: "contact", widget: "object", fields: [
              { label: "Tag", name: "tag", widget: "string" },
              { label: "Heading", name: "heading", widget: "string" },
              { label: "Text", name: "text", widget: "text" }
            ]}

      - name: "footer"
        label: "Footer"
        file: "content/footer.json"
        fields:
          - { label: "Footer", name: "footer", widget: "object", fields: [
              { label: "Company Name", name: "companyName", widget: "string" },
              { label: "Tagline", name: "tagline", widget: "string" },
              { label: "Copyright Name", name: "copyrightName", widget: "string" }
            ]}

      - name: "legal"
        label: "Privacy, Refund & Terms Pages"
        file: "content/legal.json"
        fields:
          - { label: "Legal Pages", name: "legal", widget: "object", fields: [
              { label: "Privacy Policy", name: "privacy", widget: "object", fields: [
                  { label: "Title", name: "title", widget: "string" },
                  { label: "Last Updated Text", name: "updated", widget: "string" },
                  { label: "Sections", name: "sections", widget: "list", fields: [
                      { label: "Heading (leave empty for intro paragraph)", name: "heading", widget: "string", required: false },
                      { label: "Body", name: "body", widget: "text" }
                    ]}
                ]},
              { label: "Refund Policy", name: "refund", widget: "object", fields: [
                  { label: "Title", name: "title", widget: "string" },
                  { label: "Last Updated Text", name: "updated", widget: "string" },
                  { label: "Sections", name: "sections", widget: "list", fields: [
                      { label: "Heading (leave empty for intro paragraph)", name: "heading", widget: "string", required: false },
                      { label: "Body", name: "body", widget: "text" }
                    ]}
                ]},
              { label: "Terms & Conditions", name: "terms", widget: "object", fields: [
                  { label: "Title", name: "title", widget: "string" },
                  { label: "Last Updated Text", name: "updated", widget: "string" },
                  { label: "Sections", name: "sections", widget: "list", fields: [
                      { label: "Heading (leave empty for intro paragraph)", name: "heading", widget: "string", required: false },
                      { label: "Body", name: "body", widget: "text" }
                    ]}
                ]}
            ]}
